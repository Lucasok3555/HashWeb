# Base44 development environment for HashWeb
#
# HashWeb is a single-origin app: an Apache/PHP service serves the static
# frontend (index.html) and the PHP API (servidor.php, SQLite + filesystem).
# The source is bind-mounted and served directly, so edits appear on refresh
# without rebuilding an image.
services:
  web:
    # Plain runtime image (no application code baked in): php:8.2-apache already
    # ships pdo_sqlite/sqlite3 and curl, so nothing needs to be installed.
    image: php:8.2-apache
    working_dir: /var/www/html
    ports:
      - "3000:80" # public web entry point
    volumes:
      - ./:/var/www/html
    environment:
      - BASE44_PREVIEW_MODE
    command:
      - sh
      - -ec
      - |
        # The bind mount arrives with restrictive permissions: let Apache
        # (www-data) read the source and write hashweb.db / sites/ at runtime.
        chmod -R a+rX /var/www/html
        chmod -R a+w /var/www/html
        # Skip .htaccess lookups (they fail noisily on the bind mount).
        printf '<Directory /var/www/html>\n  AllowOverride None\n  Require all granted\n</Directory>\n' > /etc/apache2/conf-available/base44.conf
        a2enconf base44 >/dev/null
        exec apache2-foreground
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null http://localhost/ || { echo "health: frontend not serving"; exit 1; };
          curl -fsS "http://localhost/servidor.php?action=status" | grep -q online || { echo "health: API not responding"; exit 1; };
          echo "health: ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: on-failure
