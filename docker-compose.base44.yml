services:
  web:
    image: php:8.2-apache
    container_name: hashweb-web
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "3000:80"
    environment:
      APACHE_SERVER_NAME: localhost
    # Enable PDO SQLite, fix bind-mount perms, configure Apache, run Apache
    command: >
      sh -c "docker-php-ext-install pdo_sqlite > /dev/null 2>&1 || true
      && chmod -R a+rX /var/www/html && chmod -R a+w /var/www/html
      && echo '<Directory /var/www/html>' > /etc/apache2/conf-available/base44.conf
      && echo 'AllowOverride None' >> /etc/apache2/conf-available/base44.conf
      && echo 'Require all granted' >> /etc/apache2/conf-available/base44.conf
      && echo '</Directory>' >> /etc/apache2/conf-available/base44.conf
      && echo 'AddDefaultCharset UTF-8' >> /etc/apache2/conf-available/base44.conf
      && echo 'Header set Cache-Control no-store' >> /etc/apache2/conf-available/base44.conf
      && a2enconf base44 > /dev/null 2>&1
      && a2enmod headers > /dev/null 2>&1
      && apache2-foreground"
    restart: unless-stopped
