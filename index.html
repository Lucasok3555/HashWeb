<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HashWeb</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;600&display=swap');

  :root{
    --bg:#0a0e0f;
    --bg2:#10161a;
    --panel:#0d1315;
    --line:#1c2b2e;
    --neon:#00ffc8;
    --neon-dim:#0a4d40;
    --neon2:#ff3d9a;
    --text:#c9f5ea;
    --text-dim:#5f8a80;
    --danger:#ff4d5e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  ::selection{background:var(--neon); color:#001210;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--neon-dim); border-radius:4px;}
  ::-webkit-scrollbar-track{background:var(--bg2);}

  header{
    display:flex; align-items:center; gap:16px;
    padding:10px 16px;
    background:var(--bg2);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .logo{
    font-family:'Share Tech Mono', monospace;
    font-size:18px; letter-spacing:3px; color:var(--neon);
    text-shadow:0 0 8px rgba(0,255,200,.5);
  }
  nav{display:flex; gap:4px; margin-left:auto;}
  nav button{
    background:transparent; border:1px solid transparent; color:var(--text-dim);
    font-family:inherit; font-size:12px; letter-spacing:1px; text-transform:uppercase;
    padding:8px 14px; cursor:pointer; border-radius:2px; transition:.15s;
  }
  nav button:hover{color:var(--text); border-color:var(--line);}
  nav button.active{color:var(--neon); border-color:var(--neon-dim); background:rgba(0,255,200,.06);}

  main{flex:1; min-height:0; position:relative;}
  .view{display:none; height:100%; flex-direction:column;}
  .view.active{display:flex;}

  /* ---------- Início ---------- */
  #view-inicio{padding:0;}
  .hash-bar{
    display:flex; gap:8px; padding:12px 16px;
    background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0;
  }
  input, select, textarea{
    background:var(--bg2); border:1px solid var(--line); color:var(--text);
    font-family:inherit; font-size:13px; padding:9px 12px; border-radius:2px;
    outline:none;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--neon-dim); box-shadow:0 0 0 1px var(--neon-dim);}
  input::placeholder{color:var(--text-dim);}
  button.btn{
    background:transparent; border:1px solid var(--neon-dim); color:var(--neon);
    font-family:inherit; font-size:12px; letter-spacing:.5px; text-transform:uppercase;
    padding:9px 16px; cursor:pointer; border-radius:2px; transition:.15s; white-space:nowrap;
  }
  button.btn:hover{background:rgba(0,255,200,.08); box-shadow:0 0 10px rgba(0,255,200,.25);}
  button.btn.pink{border-color:#7a1f4f; color:var(--neon2);}
  button.btn.pink:hover{background:rgba(255,61,154,.08); box-shadow:0 0 10px rgba(255,61,154,.25);}
  button.btn.danger{border-color:#5c1a20; color:var(--danger);}
  button.btn.danger:hover{background:rgba(255,77,94,.08);}
  button.btn.small{padding:5px 10px; font-size:11px;}
  button.btn:disabled{opacity:.4; cursor:not-allowed;}

  .hash-bar input{flex:1;}
  #frame-wrap{flex:1; position:relative; background:#000;}
  #site-frame{width:100%; height:100%; border:0; background:#fff;}
  #frame-placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:13px; flex-direction:column; gap:10px;
  }
  #frame-placeholder .big{font-size:40px; color:var(--neon-dim);}

  /* ---------- Hospedagem ---------- */
  #view-hospedagem{padding:20px; gap:20px; overflow-y:auto;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px;
  }
  .card h3{margin:0 0 12px 0; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--neon); font-weight:600;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .row input{flex:1; min-width:160px;}

  .key-box{
    margin-top:12px; padding:10px 12px; background:var(--bg2); border:1px dashed var(--neon-dim);
    border-radius:2px; font-size:12px; word-break:break-all; display:none;
  }
  .key-box.show{display:block;}
  .key-box .lbl{color:var(--text-dim); font-size:10px; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;}
  .key-box .val{color:var(--neon2); cursor:pointer;}

  #sites-list{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .site-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--bg2); border:1px solid var(--line); border-radius:2px; flex-wrap:wrap;
  }
  .site-item .name{font-weight:600; flex:1; min-width:100px;}
  .site-item .hash{color:var(--text-dim); font-size:10px; word-break:break-all; width:100%;}
  .empty-msg{color:var(--text-dim); font-size:12px; padding:8px 0;}

  /* ---------- Gerenciador de arquivos ---------- */
  #view-arquivos{flex-direction:column;}
  .fm-header{
    padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; gap:8px; align-items:center; flex-wrap:wrap; flex-shrink:0;
  }
  .fm-header .site-title{color:var(--neon); font-weight:600; margin-right:auto;}
  .breadcrumb{padding:8px 16px; background:var(--bg2); border-bottom:1px solid var(--line); font-size:12px; color:var(--text-dim); flex-shrink:0;}
  .breadcrumb span{cursor:pointer; color:var(--neon);}
  .breadcrumb span:hover{text-decoration:underline;}
  #file-list{flex:1; overflow-y:auto; padding:8px;}
  .file-row{
    display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:2px;
    border:1px solid transparent;
  }
  .file-row:hover{background:var(--panel); border-color:var(--line);}
  .file-row .icon{width:18px; text-align:center; color:var(--text-dim);}
  .file-row.dir .icon{color:var(--neon);}
  .file-row .fname{flex:1; cursor:pointer;}
  .file-row.dir .fname{color:var(--neon); font-weight:600;}
  .file-row .actions{display:flex; gap:4px;}

  /* ---------- Servidores ---------- */
  #view-servidores{padding:20px; overflow-y:auto;}
  #servers-list{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .server-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--bg2); border:1px solid var(--line); border-radius:2px;
  }
  .server-item .url{flex:1; font-size:13px; word-break:break-all;}
  .server-item.active{border-color:var(--neon-dim); box-shadow:0 0 8px rgba(0,255,200,.15);}
  .badge{font-size:10px; color:var(--neon); border:1px solid var(--neon-dim); padding:2px 6px; border-radius:2px; text-transform:uppercase;}

  /* ---------- Modal ---------- */
  .modal-bg{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:50;
    align-items:center; justify-content:center;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--neon-dim); border-radius:4px;
    width:min(560px, 92vw); max-height:85vh; display:flex; flex-direction:column;
    box-shadow:0 0 30px rgba(0,255,200,.1);
  }
  .modal-head{padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
  .modal-head h4{margin:0; font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--neon);}
  .modal-head .close{cursor:pointer; color:var(--text-dim); font-size:16px;}
  .modal-body{padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px;}
  .modal-foot{padding:12px 16px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}
  .modal textarea{min-height:320px; width:100%; font-family:'Share Tech Mono', monospace; font-size:13px; resize:vertical;}
  .modal .field-lbl{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px;}
  .msg{font-size:12px; padding:8px 10px; border-radius:2px; display:none;}
  .msg.show{display:block;}
  .msg.err{background:rgba(255,77,94,.1); color:var(--danger); border:1px solid #5c1a20;}
  .msg.ok{background:rgba(0,255,200,.08); color:var(--neon); border:1px solid var(--neon-dim);}

  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--neon-dim); color:var(--neon);
    padding:10px 18px; border-radius:2px; font-size:12px; z-index:100; display:none;
    max-width:90vw; text-align:center;
  }

  /* ---------- Editor tela cheia ---------- */
  .modal.fullscreen{ width:100vw; max-width:100vw; height:100vh; max-height:100vh; border-radius:0; border:none; }
  .modal.fullscreen .modal-body{ flex:1; min-height:0; }
  .modal.fullscreen .modal textarea{ flex:1; min-height:0; height:100%; resize:none; }

  /* ---------- Loading ---------- */
  .fm-loading{ display:flex; align-items:center; justify-content:center; padding:40px; color:var(--text-dim); gap:10px; font-size:13px; }
  .fm-loading .spinner{ width:18px; height:18px; border:2px solid var(--neon-dim); border-top-color:var(--neon); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Celular ---------- */
  @media (max-width: 640px){
    header{ padding:8px 10px; gap:8px; flex-wrap:wrap; }
    .logo{ font-size:14px; letter-spacing:2px; }
    nav{ width:100%; margin-left:0; gap:2px; }
    nav button{ flex:1; padding:8px 4px; font-size:10px; letter-spacing:.3px; text-align:center; }

    .hash-bar{ padding:8px 10px; flex-wrap:wrap; }
    .hash-bar input{ flex-basis:100%; order:1; }
    .hash-bar #btn-nav-voltar, .hash-bar #btn-nav-inicio{ order:2; }
    .hash-bar #btn-acessar{ order:2; flex:1; }

    #view-hospedagem, #view-servidores{ padding:12px; gap:14px; }
    .card{ padding:12px; }
    .row{ flex-direction:column; align-items:stretch; }
    .row input{ min-width:0; width:100%; }
    .row button{ width:100%; }

    .site-item, .server-item{ flex-direction:column; align-items:stretch; gap:6px; }
    .site-item button, .server-item button{ width:100%; }
    .server-item .badge{ align-self:flex-start; }

    .fm-header{ padding:8px 10px; gap:6px; }
    .fm-header .site-title{ flex-basis:100%; margin-right:0; }
    .fm-header button{ flex:1; }
    .breadcrumb{ padding:6px 10px; font-size:11px; overflow-x:auto; white-space:nowrap; }

    .file-row{ flex-wrap:wrap; padding:8px; }
    .file-row .fname{ flex-basis:100%; }
    .file-row .actions{ width:100%; justify-content:flex-start; flex-wrap:wrap; margin-top:4px; }
    .file-row .actions button{ flex:1 1 auto; }

    .modal{ width:96vw; max-height:92vh; }
    .modal-body{ padding:12px; }
    .modal textarea{ min-height:200px; font-size:12px; }
    .modal-foot{ flex-wrap:wrap; }
    .modal-foot button{ flex:1; }

    button.btn{ font-size:11px; padding:8px 10px; }
    button.btn.small{ padding:6px 8px; font-size:10px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">HASHWEB</div>
  <nav>
    <button class="tab-btn active" data-view="inicio">Início</button>
    <button class="tab-btn" data-view="hospedagem">Hospedagem</button>
    <button class="tab-btn" data-view="servidores">Servidores</button>
  </nav>
</header>

<main>

  <!-- ===== TELA INICIAL ===== -->
  <section id="view-inicio" class="view active">
    <div class="hash-bar">
      <button class="btn small" id="btn-nav-voltar" title="Página anterior">←</button>
      <button class="btn small" id="btn-nav-inicio" title="Ir para o index.html">⌂</button>
      <input id="hash-input" type="text" placeholder="hash do site, ou hash/pagina.html">
      <button class="btn" id="btn-acessar">Acessar</button>
    </div>
    <div id="frame-wrap">
      <div id="frame-placeholder">
        <div class="big">◆</div>
        <div>Insira um hash (ou hash/pagina.html) acima para exibir um site.</div>
      </div>
      <iframe id="site-frame" style="display:none;"></iframe>
    </div>
  </section>

  <!-- ===== HOSPEDAGEM ===== -->
  <section id="view-hospedagem" class="view">
    <div class="card">
      <h3>Criar novo site</h3>
      <div class="row">
        <input id="new-site-name" type="text" placeholder="Nome do site">
        <button class="btn" id="btn-criar-site">Criar</button>
      </div>
      <div class="key-box" id="new-site-key">
        <div class="lbl">Guarde esta chave privada — ela é a única forma de editar este site</div>
        <div class="val" id="new-site-key-val" title="Clique para copiar"></div>
      </div>
    </div>

    <div class="card">
      <h3>Recuperar site por chave privada</h3>
      <div class="row">
        <input id="recover-key" type="text" placeholder="Chave privada">
        <button class="btn pink" id="btn-recuperar">Recuperar</button>
      </div>
    </div>

    <div class="card">
      <h3>Meus sites</h3>
      <div id="sites-list"></div>
    </div>
  </section>

  <!-- ===== GERENCIADOR DE ARQUIVOS ===== -->
  <section id="view-arquivos" class="view">
    <div class="fm-header">
      <span class="site-title" id="fm-site-name">—</span>
      <button class="btn small" id="btn-nova-pasta">+ Pasta</button>
      <button class="btn small" id="btn-novo-arquivo">+ Arquivo</button>
      <button class="btn small" id="btn-upload">↑ Upload</button>
      <button class="btn small pink" id="btn-sync-rede">⟲ Sincronizar rede</button>
      <button class="btn small pink" id="btn-fm-voltar">Voltar</button>
    </div>
    <div class="breadcrumb" id="fm-breadcrumb"></div>
    <div id="file-list"><div class="fm-loading"><div class="spinner"></div>Carregando arquivos...</div></div>
  </section>

  <!-- ===== SERVIDORES ===== -->
  <section id="view-servidores" class="view">
    <div class="card">
      <h3>Adicionar servidor</h3>
      <div class="row">
        <input id="new-server-url" type="text" placeholder="https://exemplo.com/servidor.php">
        <button class="btn" id="btn-add-server">Adicionar</button>
      </div>
    </div>
    <div class="card">
      <h3>Servidores</h3>
      <div id="servers-list"></div>
    </div>
  </section>

</main>

<!-- Modal genérico (prompt) -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="modal-head">
      <h4 id="modal-title">—</h4>
      <span class="close" id="modal-close">✕</span>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

// ---------- estado ----------
const LS_SERVERS = 'hashweb_servers';
const LS_SITES    = 'hashweb_sites'; // lista plana: [{hash,name,private_key,server}]

let servers = JSON.parse(localStorage.getItem(LS_SERVERS) || '[]');
let mySites = migrarSites(JSON.parse(localStorage.getItem(LS_SITES) || '[]'));

let fmSite = null;   // {hash, name, private_key, server}
let fmPath = '/';

// Migra o formato antigo ({servidor: [sites]}) para a lista plana com campo "server"
function migrarSites(raw){
  if(Array.isArray(raw)) return raw;
  const out = [];
  Object.keys(raw||{}).forEach(server=>{
    (raw[server]||[]).forEach(s=> out.push(Object.assign({server}, s)));
  });
  return out;
}

function saveServers(){ localStorage.setItem(LS_SERVERS, JSON.stringify(servers)); }
function saveSites(){ localStorage.setItem(LS_SITES, JSON.stringify(mySites)); }

// ---------- ofuscação de caminhos (baralhar para o servidor) ----------
function getScrambleKey(privateKey){
  if(!privateKey) return null;
  const key = [];
  for(let i=0; i<privateKey.length; i+=2) key.push(parseInt(privateKey.substr(i,2),16));
  return key;
}
function scrambleSeg(seg, key){
  if(!key || !seg) return seg;
  const dotIdx = seg.lastIndexOf('.');
  const name = dotIdx>0 ? seg.substring(0,dotIdx) : seg;
  const ext = dotIdx>0 ? seg.substring(dotIdx) : '';
  let enc = '';
  for(let i=0; i<name.length; i++) enc += String.fromCharCode(name.charCodeAt(i) ^ key[i % key.length]);
  return btoa(enc).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'') + ext;
}
function descrambleSeg(seg, key){
  if(!key || !seg) return seg;
  const dotIdx = seg.lastIndexOf('.');
  const encoded = dotIdx>0 ? seg.substring(0,dotIdx) : seg;
  const ext = dotIdx>0 ? seg.substring(dotIdx) : '';
  let b64 = encoded.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length % 4) b64 += '=';
  try {
    const dec = atob(b64);
    let out = '';
    for(let i=0; i<dec.length; i++) out += String.fromCharCode(dec.charCodeAt(i) ^ key[i % key.length]);
    return out + ext;
  } catch(e){ return seg; }
}
function scramblePath(path, key){
  if(!key) return path;
  const parts = path.split('/').filter(Boolean);
  return '/' + parts.map(s => scrambleSeg(s, key)).join('/');
}
function descramblePath(path, key){
  if(!key) return path;
  const parts = path.split('/').filter(Boolean);
  return '/' + parts.map(s => descrambleSeg(s, key)).join('/');
}
function siteScrambleKey(hash){
  const s = mySites.find(s => s.hash === hash);
  return s ? getScrambleKey(s.private_key) : null;
}

// Wrapper que aplica ofuscação de caminhos nas chamadas da API do gerenciador
function fmApi(server, action, params, method, explicitKey){
  const key = explicitKey || (fmSite ? getScrambleKey(fmSite.private_key) : null);
  const sp = Object.assign({}, params || {});
  if(key){
    if(sp.path) sp.path = scramblePath(sp.path, key);
    if(sp.dest) sp.dest = scramblePath(sp.dest, key);
    if(sp.name) sp.name = scrambleSeg(sp.name, key);
    if(sp.new_name) sp.new_name = scrambleSeg(sp.new_name, key);
  }
  return apiOn(server, action, sp, method);
}

// Busca arquivo tentando path ofuscado (se houver chave) depois o path normal
async function getFileSmart(server, hash, path, key){
  const attempts = [];
  if(key){ const sp = scramblePath(path, key); if(sp !== path) attempts.push(sp); }
  attempts.push(path);
  for(const tryPath of attempts){
    try {
      if(server) return {server, data: await apiOn(server, 'get_file', {hash, path: tryPath})};
      return await apiAny('get_file', {hash, path: tryPath});
    } catch(e){ /* tenta próximo */ }
  }
  throw new Error('arquivo não encontrado');
}

// Chama a API em UM servidor específico (usado quando já sabemos onde o site mora)
function apiOn(server, action, params, method){
  method = method || 'GET';
  const base = server.replace(/\/$/, '');
  if(method === 'GET'){
    const qs = new URLSearchParams(Object.assign({action}, params||{})).toString();
    return fetch(base + '?' + qs).then(handleRes);
  } else {
    const fd = new URLSearchParams(Object.assign({action}, params||{}));
    return fetch(base, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: fd.toString()}).then(handleRes);
  }
}

// Tenta em TODOS os servidores da lista, um de cada vez, na ordem cadastrada.
// Se um servidor falhar (fora do ar, ou não tem a informação), passa para o próximo.
// Resolve com {server, data} do primeiro que responder com sucesso.
function apiAny(action, params, method){
  if(servers.length===0){
    toast('Nenhum servidor cadastrado. Vá em Servidores.');
    return Promise.reject(new Error('nenhum servidor cadastrado'));
  }
  let i = 0;
  function attempt(lastErr){
    if(i >= servers.length) return Promise.reject(lastErr || new Error('não encontrado em nenhum servidor'));
    const server = servers[i++];
    return apiOn(server, action, params, method)
      .then(data => ({server, data}))
      .catch(err => attempt(err));
  }
  return attempt();
}

function handleRes(res){
  return res.json().then(data => {
    if(!res.ok || data.error) throw new Error(data.error || 'erro desconhecido');
    return data;
  });
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.style.display='none'; }, 3200);
}

// ---------- navegação de abas ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> showView(btn.dataset.view));
});
function showView(name){
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.view===name));
  document.querySelectorAll('.view').forEach(v=> v.classList.toggle('active', v.id==='view-'+name));
  if(name==='hospedagem') renderSitesList();
  if(name==='servidores') renderServersList();
}

// ===================== TELA INICIAL =====================
// A navegação não usa mais a rota /raw/ direto no iframe: o cliente busca o
// conteúdo via API (get_file), embute CSS/JS internos e troca os links <a>
// internos por navegação local (sem sair do visualizador), suportando
// endereços do tipo "hash" ou "hash/pasta/pagina.html".

let navHash = null;
let navHistory = []; // [{hash, path}, ...]

document.getElementById('btn-acessar').addEventListener('click', acessarEndereco);
document.getElementById('hash-input').addEventListener('keydown', e=>{ if(e.key==='Enter') acessarEndereco(); });
document.getElementById('btn-nav-voltar').addEventListener('click', ()=>{
  if(navHistory.length > 1){
    navHistory.pop();
    const prev = navHistory[navHistory.length - 1];
    navegarPara(prev.hash, prev.path, {noHistory:true});
  } else {
    toast('Não há página anterior.');
  }
});

  }
});

// Aceita: hash puro, "hash/caminho/pagina.html", ou até uma URL colada
// contendo "/raw/HASH/caminho".
function parseEndereco(raw){
  raw = (raw||'').trim();
  const urlMatch = raw.match(/raw\/([a-f0-9]{64})(\/[^?#]*)?/i);
  if(urlMatch) return {hash: urlMatch[1].toLowerCase(), path: urlMatch[2] || '/index.html'};
  const m = raw.match(/^([a-f0-9]{64})(\/.*)?$/i);
  if(m) return {hash: m[1].toLowerCase(), path: m[2] || '/index.html'};
  return null;
}

function acessarEndereco(){
  const addr = parseEndereco(document.getElementById('hash-input').value);
  if(!addr){ toast('Endereço inválido. Use o hash (64 caracteres) ou hash/pagina.html'); return; }
  navHistory = [];
  navegarPara(addr.hash, addr.path);
}

function siteServerConhecido(hash){
  const s = mySites.find(s=> s.hash===hash);
  return s ? s.server : null;
}

function atualizarBarraEndereco(hash, path){
  const input = document.getElementById('hash-input');
  input.value = (path && path !== '/index.html') ? (hash + path) : hash;
}

async function navegarPara(hash, path, opts){
  opts = opts || {};
  path = path || '/index.html';
  if(!path.startsWith('/')) path = '/' + path;
  toast('Carregando página...');
  try{
    const server = siteServerConhecido(hash);
    const key = siteScrambleKey(hash);
    const result = await getFileSmart(server, hash, path, key);

    const html = await montarPaginaLocal(result.data.content, hash, path, result.server);
    const frame = document.getElementById('site-frame');
    frame.srcdoc = html;
    frame.style.display = 'block';
    document.getElementById('frame-placeholder').style.display = 'none';

    navHash = hash;
    if(!opts.noHistory) navHistory.push({hash, path});
    atualizarBarraEndereco(hash, path);
  } catch(e){
    toast('Página não encontrada em nenhum servidor cadastrado.');
  }
}

function enderecoExterno(href){
  return !href || /^([a-z][a-z0-9+.-]*:)?\/\//i.test(href) || /^(mailto:|tel:|javascript:|data:)/i.test(href) || href.startsWith('#');
}

// Resolve um href relativo (ex: "test.html", "../outra/pagina.html") para um
// caminho absoluto dentro do site, a partir da pasta do arquivo atual.
function resolverCaminho(baseDir, rel){
  const dir = rel.startsWith('/') ? '/' : baseDir;
  const combined = rel.startsWith('/') ? rel : dir + rel;
  const parts = [];
  combined.split('/').forEach(seg=>{
    if(seg==='' || seg==='.') return;
    if(seg==='..'){ parts.pop(); return; }
    parts.push(seg);
  });
  return '/' + parts.join('/');
}

// Reescreve o HTML de uma página do site: embute CSS/JS internos (buscados
// via API, com path ofuscado quando a chave privada é conhecida) e transforma
// <a href="pagina.html"> em navegação interna, suportando pastas na URL.
async function montarPaginaLocal(htmlText, hash, currentPath, server){
  const key = siteScrambleKey(hash);
  const baseDir = currentPath.replace(/[^/]*$/, '') || '/';
  const doc = new DOMParser().parseFromString(htmlText, 'text/html');

  // Busca conteúdo de arquivo, tentando path ofuscado depois o normal
  async function getFileContent(path){
    const attempts = [];
    if(key){ const sp = scramblePath(path, key); if(sp !== path) attempts.push(sp); }
    attempts.push(path);
    for(const tryPath of attempts){
      try { return (await apiOn(server, 'get_file', {hash, path: tryPath})).content; }
      catch(e){ /* tenta próximo */ }
    }
    throw new Error('not found');
  }

  doc.querySelectorAll('a[href]').forEach(a=>{
    const href = a.getAttribute('href');
    if(enderecoExterno(href)){
      if(href && /^([a-z][a-z0-9+.-]*:)?\/\//i.test(href)){
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener');
      }
      return;
    }
    a.setAttribute('data-hw-path', resolverCaminho(baseDir, href));
    a.removeAttribute('href');
    a.style.cursor = 'pointer';
  });

  const folhas = Array.from(doc.querySelectorAll('link[rel~="stylesheet"][href]'));
  for(const link of folhas){
    const href = link.getAttribute('href');
    if(enderecoExterno(href)) continue;
    try{
      const css = await getFileContent(resolverCaminho(baseDir, href));
      const style = doc.createElement('style');
      style.textContent = css;
      link.replaceWith(style);
    }catch(e){ /* arquivo não encontrado — deixa o link como está */ }
  }

  // Tags <script src> — o endereço é resolvido a partir do hash/pasta atual
  const scripts = Array.from(doc.querySelectorAll('script[src]'));
  for(const scr of scripts){
    const src = scr.getAttribute('src');
    if(enderecoExterno(src)) continue;
    try{
      const js = await getFileContent(resolverCaminho(baseDir, src));
      const novo = doc.createElement('script');
      novo.textContent = js;
      scr.replaceWith(novo);
    }catch(e){ /* arquivo não encontrado — deixa o script como está */ }
  }

  const navScript = doc.createElement('script');
  navScript.textContent = `
    document.addEventListener('click', function(e){
      var a = e.target.closest('a[data-hw-path]');
      if(a){
        e.preventDefault();
        window.parent.postMessage({type:'hashweb-nav', path:a.getAttribute('data-hw-path')}, '*');
      }
    });
  `;
  doc.body.appendChild(navScript);

  return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
}

function criarSite(){

  apiOn(server, 'create_site', {name}, 'POST').then(async data=>{
    mySites.push({hash:data.hash, name:data.name, private_key:data.private_key, server});

      + escapeHtml(name) + '</title>\n</head>\n<body>\n<h1>' + escapeHtml(name)

function renderFileList(items){
  const el = document.getElementById('file-list');
  el.innerHTML = '';
  if(items.length===0){
    el.innerHTML = '<div class="empty-msg" style="padding:12px;">Pasta vazia.</div>';
    return;
  }
  items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'file-row' + (item.is_dir ? ' dir' : '');
    row.innerHTML = `
      <span class="icon">${item.is_dir ? '📁' : '📄'}</span>
      <span class="fname">${escapeHtml(item.name)}</span>
      <div class="actions">
        ${item.is_dir ? '' : '<button class="btn small" data-act="editar">Editar</button>'}
        <button class="btn small" data-act="renomear">Renomear</button>
        <button class="btn small" data-act="mover">Mover</button>
        <button class="btn small" data-act="copiar">Copiar</button>
        <button class="btn small danger" data-act="apagar">Apagar</button>
      </div>
    `;
    const itemPath = joinPath(fmPath, item.name);
    row.querySelector('.fname').addEventListener('click', ()=>{
      if(item.is_dir){ fmPath = itemPath; loadFiles(); }
      else abrirEditor(itemPath);
    });

    if(editBtn) editBtn.addEventListener('click', ()=> abrirEditor(itemPath));

// ===================== REDE (replicação) =====================
// Todos os arquivos do site são copiados para todos os servidores da lista.
// O conteúdo das pastas fica ofuscado (baralhado) para o servidor.
async function listAllFiles(server, hash, key){
  async function recurse(path){
    const scrambledPath = scramblePath(path, key);
    const data = await apiOn(server, 'list_files', {hash, path: scrambledPath});
    const items = data.items.map(item => ({
      ...item,
      realName: descrambleSeg(item.name, key),
      realPath: joinPath(path, descrambleSeg(item.name, key))
    }));
    let files = [];
    for(const item of items){
      if(item.is_dir) files = files.concat(await recurse(item.realPath));
      else files.push({path: item.realPath, name: item.realName});
    }
    return files;
  }
  return recurse('/');
}

async function sincronizarRede(site){
  const otherServers = servers.filter(s => s !== site.server);
  if(otherServers.length === 0){ toast('Não há outros servidores para replicar.'); return; }
  const key = getScrambleKey(site.private_key);
  toast('Listando arquivos...');
  let files;
  try { files = await listAllFiles(site.server, site.hash, key); }
  catch(e){ toast('Erro ao listar arquivos: ' + e.message); return; }
  if(files.length === 0){ toast('Site vazio — nada para replicar.'); return; }
  for(const server of otherServers){
    toast('Replicando para ' + server + '...');
    try {
      await apiOn(server, 'import_site', {name: site.name, private_key: site.private_key}, 'POST');
      for(const file of files){
        const scrambledPath = scramblePath(file.path, key);
        const data = await apiOn(site.server, 'get_file_b64', {hash: site.hash, path: scrambledPath});
        const dir = scrambledPath.replace(/[^/]*$/, '');
        const name = scrambledPath.split('/').pop();
        await apiOn(server, 'upload_file', {
          hash: site.hash, private_key: site.private_key,
          path: dir, name, content: data.content
        }, 'POST');
      }
      toast('Replicado para ' + server);
    } catch(e){ toast('Erro ao replicar para ' + server + ': ' + e.message); }
  }
  toast('Sincronização concluída para ' + otherServers.length + ' servidor(es).');
}

document.getElementById('btn-sync-rede').addEventListener('click', ()=>{
  if(fmSite) sincronizarRede(fmSite);
});

// ===================== SERVIDORES =====================
// Não existe mais "servidor ativo": o cliente usa TODOS os servidores da lista,
// tentando um de cada vez (na ordem cadastrada) para achar/gravar informação.
// Se um servidor estiver fora do ar ou não tiver o dado, o próximo é tentado.
document.getElementById('btn-add-server').addEventListener('click', ()=>{
  const input = document.getElementById('new-server-url');
  let url = input.value.trim();
  if(!url){ toast('Informe o endereço do servidor.'); return; }
  url = url.replace(/\/$/, '');
  if(servers.includes(url)){ toast('Servidor já adicionado.'); return; }
  servers.push(url);
  saveServers();
  input.value = '';
  renderServersList();
  toast('Servidor adicionado.');
});

function renderServersList(){
  const el = document.getElementById('servers-list');
  if(servers.length===0){ el.innerHTML = '<div class="empty-msg">Nenhum servidor adicionado.</div>'; return; }
  el.innerHTML = '';
  servers.forEach((url, idx)=>{
    const div = document.createElement('div');
    div.className = 'server-item';
    div.innerHTML = `
      <span class="badge">${idx+1}ª tentativa</span>
      <span class="url">${escapeHtml(url)}</span>
      <button class="btn small" data-act="editar">Editar</button>
      <button class="btn small danger" data-act="remover">Remover</button>
    `;
    div.querySelector('[data-act="editar"]').addEventListener('click', ()=> editarServidor(url));
    div.querySelector('[data-act="remover"]').addEventListener('click', ()=> removerServidor(url));
    el.appendChild(div);
  });
}

function editarServidor(url){
  openModal('Editar servidor', `
    <div class="field-lbl">Endereço</div>
    <input id="m-server-url" type="text" value="${escapeHtml(url)}">
  `, [
    {label:'Cancelar', cls:'', onClick: closeModal},
    {label:'Salvar', cls:'', onClick: ()=>{
      let newUrl = document.getElementById('m-server-url').value.trim().replace(/\/$/, '');
      if(!newUrl) return;
      const idx = servers.indexOf(url);
      servers[idx] = newUrl;
      mySites.forEach(s=>{ if(s.server===url) s.server = newUrl; });
      saveServers(); saveSites();
      closeModal(); renderServersList(); toast('Servidor atualizado.');
    }}
  ]);
}

function removerServidor(url){
  openModal('Remover servidor', `<div>Remover "${escapeHtml(url)}" da lista? (Os sites continuam existindo no servidor, mas o cliente não vai mais tentar acessá-lo automaticamente.)</div>`, [
    {label:'Cancelar', cls:'', onClick: closeModal},
    {label:'Remover', cls:'danger', onClick: ()=>{
      servers = servers.filter(s=> s!==url);
      saveServers();
      closeModal(); renderServersList(); toast('Servidor removido.');
    }}
  ]);
}

// ===================== MODAL =====================
function openModal(title, bodyHtml, buttons, fullscreen){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  const foot = document.getElementById('modal-foot');
  foot.innerHTML = '';
  buttons.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls||'');
    btn.textContent = b.label;
    btn.addEventListener('click', b.onClick);
    foot.appendChild(btn);
  });
  document.querySelector('.modal').classList.toggle('fullscreen', !!fullscreen);
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('show'); }
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-bg').addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- inicialização ----------
renderServersList();

})();
</script>
